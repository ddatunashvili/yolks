name: uptime-kuma

on:
  push:
    branches: [main]
    paths: ['uptime-kuma/**', '.github/workflows/uptime-kuma.yml']
  workflow_dispatch:
  schedule:
    # Monthly rebuild picks up Debian and Node security updates. Uptime Kuma
    # itself is installed by the egg, so a new release needs no image.
    - cron: '0 3 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolks" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: uptime-kuma
          platforms: linux/amd64,linux/arm64
          build-args: NODE_MAJOR=22
          push: true
          tags: ${{ steps.tags.outputs.image }}:app_uptime-kuma
          cache-from: type=gha,scope=app-uptime-kuma
          cache-to: type=gha,mode=max,scope=app-uptime-kuma
