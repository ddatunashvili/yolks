name: zig

on:
  push:
    branches: [main]
    paths: ['zig/**', '.github/workflows/zig.yml']
  workflow_dispatch:
  schedule:
    # Monthly rebuild picks up Debian security updates.
    - cron: '0 3 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 0.17.0
            tags: zig_0.17,zig_latest
          - version: 0.16.0
            tags: zig_0.16
          - version: 0.15.2
            tags: zig_0.15
          - version: 0.14.1
            tags: zig_0.14
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolks"
          out=""
          for t in $(echo "${{ matrix.tags }}" | tr ',' ' '); do out="${out}${image}:${t},"; done
          echo "list=${out%,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: zig
          platforms: linux/amd64,linux/arm64
          build-args: ZIG_VERSION=${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=zig-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=zig-${{ matrix.version }}
