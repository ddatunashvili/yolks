name: forgejo

on:
  push:
    branches: [main]
    paths: ['forgejo/**', '.github/workflows/forgejo.yml']
  workflow_dispatch:
  schedule:
    # Monthly rebuild picks up base-image security updates.
    - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 16.0.6
            tags: app_forgejo,app_forgejo_16
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolks"
          out=""
          for t in $(echo "${{ matrix.tags }}" | tr ',' ' '); do out="${out}${image}:${t},"; done
          echo "list=${out%,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: forgejo
          platforms: linux/amd64,linux/arm64
          build-args: FORGEJO_VERSION=${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=forgejo-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=forgejo-${{ matrix.version }}
