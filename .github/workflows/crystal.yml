name: crystal

on:
  push:
    branches: [main]
    paths: ['crystal/**', '.github/workflows/crystal.yml']
  workflow_dispatch:
  schedule:
    # Monthly rebuild picks up Debian security updates.
    - cron: '0 3 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.22.0
            tags: crystal_1.22,crystal_latest
          - version: 1.21.1
            tags: crystal_1.21
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yolks"
          out=""
          for t in $(echo "${{ matrix.tags }}" | tr ',' ' '); do out="${out}${image}:${t},"; done
          echo "list=${out%,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: crystal
          platforms: linux/amd64,linux/arm64
          build-args: CRYSTAL_VERSION=${{ matrix.version }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=crystal-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=crystal-${{ matrix.version }}
